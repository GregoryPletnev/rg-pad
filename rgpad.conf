# rgpad: RG35XXH gamepad -> keyboard + mouse (uinput)
# Comments start with # or ; at the beginning of a line (no inline comments).
# Apply changes: systemctl restart rgpad

[devices]
gamepad = gpio-keys-gamepad
joystick = adc-joystick

[general]
# Hold both buttons to switch between key mapping and raw gamepad (games).
toggle = start+menu
# LED showing the layer: off = layer 1, on = layer 2, blinking = layer 3+.
led = red:status
# Take the resting stick positions at startup as centers.
calibrate_on_start = 1

[buttons]
# button = KEY name (ENTER, ESC, F1..F12, UP, LEFTCTRL...)
#        | BTN_LEFT / BTN_RIGHT / BTN_MIDDLE (mouse) | @layer (next layer)
# Buttons: a b x y l1 r1 l2 r2 l3 r3 select start menu up down left right.
# X/A/B/Y without an entry here are chord buttons (see [layer ...]).
select = ENTER
l1 = ESC
l2 = F10
r2 = F9
up = UP
down = DOWN
left = LEFT
right = RIGHT
start = LEFTCTRL
menu = @layer
r1 = BTN_LEFT
r3 = BTN_RIGHT
l3 = BTN_MIDDLE

[left_stick]
# Deflection (0..1) at which the stick selects a chord direction.
threshold = 0.5
invert_x = 0
invert_y = 1

[mouse]
# Right stick moves the pointer.
deadzone = 0.12
# Pixels per tick at full deflection, ticks per second, response curve.
speed = 10
rate = 100
accel = 2.0
invert_x = 0
invert_y = 1

[right_stick]
# mode = mouse (default, see [mouse]) or keys.
# In keys mode the stick does not move the pointer: each of the 8
# directions presses one key while held, in clock order from east.
mode = mouse
# Deflection (0..1) at which a direction counts as pressed.
threshold = 0.7
# Poll interval for direction changes, ms.
repeat_ms = 100
# Keys for e ne n nw w sw s se. Needed only with mode = keys.
# keys = F1 F2 F3 F4 F5 F6 F7 F8

# Chords: left stick direction + X/A/B/Y.
# Each line has 4 tokens for X A B Y (clockwise from the top of the diamond).
# Directions: n ne e se s sw w nw; "center" = stick at rest.
# Token: one character (typed with the US layout) or a KEY name (SPACE, TAB...).
# Layers are cycled in the order they appear here.

[layer abc]
center = TAB SPACE BACKSPACE DELETE
n  = a b c d
ne = e f g h
e  = i j k l
se = m n o p
s  = q r s t
sw = u v w x
w  = y z . ,
nw = - / ' ?

[layer ABC]
center = TAB SPACE BACKSPACE DELETE
n  = A B C D
ne = E F G H
e  = I J K L
se = M N O P
s  = Q R S T
sw = U V W X
w  = Y Z : ;
nw = _ | " !

[layer 123]
center = TAB SPACE BACKSPACE DELETE
n  = 1 2 3 4
ne = 5 6 7 8
e  = 9 0 = +
se = * & | ;
s  = < > ( )
sw = [ ] { }
w  = $ # ~ `
nw = @ % ^ \
